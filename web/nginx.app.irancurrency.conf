server {
    listen 80;
    listen [::]:80;
    server_name app.irancurrency.eu.cc;

    root /var/www/irancurrency-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|json)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
